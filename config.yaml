llm:
  # OpenRouter model — change to any model at https://openrouter.ai/models
  # "qwen/qwen3-235b-a22b" is Qwen3 235B A22B (Qwen 3 Plus flagship MoE)
  model: qwen/qwen3.6-plus
  base_url: https://openrouter.ai/api/v1
  max_tokens:
    marketplace: 2000
    compiler: 3000

pricing:
  tips:
    standard_200ul: 0.18   # USD per 200µL tip
    large_1000ul: 0.35     # USD per 1000µL tip
  reagents:
    enzyme: 0.08           # USD per µL (polymerases, ligases, kinases)
    antibody: 0.12         # USD per µL
    buffer: 0.001          # USD per µL (PBS, Tris, saline)
    default: 0.004         # USD per µL (general reagents)
  machine_time_per_min: 0.35  # USD per minute of robot time

rag:
  protocols_io_max: 3         # protocols.io: protocols to inject per query
  protocols_io_detail_max: 2  # protocols.io: how many to fetch full steps/materials for
